# Lint, tipos e testes (com Postgres de verdade, sem chave de LLM e sem internet) e o build das imagens.
name: ci

on:
  push:
  pull_request:

# O CI só lê o código: o token do GitHub não precisa escrever nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compras_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/compras_teste
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  imagens:
    name: build das imagens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose --profile testes build testes
