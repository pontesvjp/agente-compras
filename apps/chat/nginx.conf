# Uma porta só: o nginx serve o chat e repassa /api e /requisicoes ao backend e /mcp ao servidor MCP.

# Repassa o X-Request-Id de quem chamou; sem ele, usa o id do próprio nginx.
map $http_x_request_id $id_rastreio {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $id_rastreio;
    # Um atendimento pode levar até 60 s (LLM_TIMEOUT_MS).
    proxy_read_timeout 90s;

    # /api/requisicoes -> backend /requisicoes
    location /api/ {
        proxy_pass http://backend:3000/;
    }

    # A rota exatamente como no enunciado: POST e GET /requisicoes.
    location = /requisicoes {
        proxy_pass http://backend:3000;
    }
    location /requisicoes/ {
        proxy_pass http://backend:3000;
    }

    # O mesmo servidor MCP que o backend usa, para qualquer cliente MCP (ex.: Claude Code).
    location = /mcp {
        proxy_pass http://mcp-server:3001;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
