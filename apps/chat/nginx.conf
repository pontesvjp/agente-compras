# Uma porta só: o nginx serve o chat e repassa /api e /requisicoes ao backend e /mcp ao servidor MCP.

# Repassa o X-Request-Id de quem chamou; sem ele, usa o id do próprio nginx.
map $http_x_request_id $id_rastreio {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS do Docker, consultado de novo a cada 10 s: se o backend for recriado (ex.: troca da chave
    # no .env) e voltar com outro IP, o chat continua funcionando sem reiniciar o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    set $mcp http://mcp-server:3001;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Troca, não acrescenta: o X-Forwarded-For que o cliente mandar não chega ao backend.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $id_rastreio;
    # Só o backend liga a requisição ao atendimento, de dentro da rede do compose. Vindo de fora
    # (/mcp), o cabeçalho penduraria uma requisição no atendimento de outra pessoa.
    proxy_set_header X-Atendimento-Id "";
    # Um atendimento pode levar até 60 s (LLM_TIMEOUT_MS).
    proxy_read_timeout 90s;

    # /api/requisicoes -> backend /requisicoes
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # A rota exatamente como no enunciado: POST e GET /requisicoes.
    location = /requisicoes {
        proxy_pass $backend;
    }
    location /requisicoes/ {
        proxy_pass $backend;
    }

    # O mesmo servidor MCP que o backend usa, para qualquer cliente MCP (ex.: Claude Code).
    location = /mcp {
        proxy_pass $mcp;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
